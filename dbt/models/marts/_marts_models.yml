version: 2

models:
  - name: fct_orders
    description: "One row per order, with customer, item totals, main category and delivery outcome."
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: customer_unique_id
        data_tests:
          - not_null
  
  - name: ml_late_delivery_features
    description: "One row per delivered order. Only purchase-time information, plus the is_late target."
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: is_late
        data_tests:
          - not_null
      - name: promised_days
        data_tests:
          - not_null

  - name: ml_history_features
    description: "Seller reliability and recent delivery conditions, computed only from orders delivered before each purchase."
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: seller_past_orders
        data_tests:
          - not_null